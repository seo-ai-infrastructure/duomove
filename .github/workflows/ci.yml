name: Probe CI
on:
  push:
    branches: [main, feat/python-motion-runtime]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q src tests
      - run: python -m pip wheel --no-deps --wheel-dir dist .
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t duomove-probe:test .
      - name: Read-only container process smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --name duomove-ci -d -p 127.0.0.1:8000:8000 duomove-probe:test
          trap 'docker logs duomove-ci; docker rm -f duomove-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > health.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; assert json.load(open("health.json"))["mode"] == "probe_only"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/status)" = 503
